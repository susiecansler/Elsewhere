# Austin seed corpus — named institutions locals would miss.
#
# Curated by hand. These are the *queries*: the places someone leaving Austin
# would want an equivalent for. Roles are deliberately NOT pre-assigned — the
# model tags both sides, and hand-tagging the source would make the tagging
# step untestable.
#
# `aliases` is how people actually type it, and feeds phase 5 entity
# resolution. Include the abbreviation, the misspelling, and the shorthand.
#
# Closed or relocated entries are expected and fine — the Foursquare join in
# `elsewhere seeds build` and the phase 3 verification pass exist to catch
# them. Curate confidently; let verification do its job.

