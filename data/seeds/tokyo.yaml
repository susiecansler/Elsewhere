# Tokyo seed corpus — named institutions a resident would miss.
#
# Curated by hand, same as the US cities, but with two differences worth
# stating because they change how the results should be read:
#
# 1. Names are given in the form an English-speaking visitor would type, with
#    the Japanese written form as an alias. Overture's Tokyo rows are almost
#    entirely Japanese with no English alternate, so the verification join
#    lands far less often here than it does for Austin or Chicago. Unverified
#    is the expected state for much of this list; it means "we couldn't
#    confirm it in Overture", not "it doesn't exist".
#
# 2. Several entries are types with a flagship rather than single businesses —
#    a konbini, a sento, a depachika. That is deliberate. The role is the unit
#    of matching, and for these the role is what a visitor is actually asking
#    about.
#
# Chains are included where the chain *is* the institution locally, which is
# the same rule that puts H-E-B in the Austin list.

