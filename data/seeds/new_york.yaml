# New York seed corpus — named institutions locals would miss.
#
# The hardest list in the project so far, for two reasons.
#
# 1. A Manhattan-only list would answer for a city nobody lives in. Most of
#    what New Yorkers actually name is outer-borough — Di Fara, Peter Pan,
#    Arthur Avenue, the Rockaways — so the boroughs are represented roughly
#    the way people talk about them, not the way guidebooks rank them.
#
# 2. "The New York equivalent" is often a *type* rather than a business: the
#    bodega, the slice shop, the dollar-slice place, the corner deli. Those
#    are seeded as the flagship example of the type, because the role is the
#    unit of matching and the role is what a visitor is really asking about.
#
# Deliberately thin on: Times Square, anything a New Yorker would only visit
# with out-of-town parents, and restaurants famous for being expensive.

