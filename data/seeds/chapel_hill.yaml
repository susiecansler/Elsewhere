# Chapel Hill seed corpus — named institutions locals would miss.
#
# Two judgement calls specific to this one:
#
# 1. Carrboro is in. It is a separate municipality and nobody who lives here
#    treats it as one — Weaver Street lawn and Cat's Cradle are as central to
#    Chapel Hill life as anything on Franklin Street, and a list that stopped
#    at the town line would answer for a town that doesn't exist.
#
# 2. The university is not a category, it's the weather. UNC places are here
#    where they function as public institutions rather than as campus
#    facilities: the Old Well is a landmark, Wilson Library is a reading room,
#    Franklin Street on a championship night is a civic event.
#
# Chapel Hill is small, so this list is shorter than Chicago's and that is
# correct — padding it with anything a local wouldn't name would make the
# matches worse, not the coverage better.

