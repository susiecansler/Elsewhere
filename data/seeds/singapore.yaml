# Singapore seed corpus — named institutions locals would miss.
#
# Three judgement calls:
#
# 1. Hawker centres are the backbone. They are not street food attractions,
#    they are where a large share of the country eats most days, and the
#    named stall inside a named centre is how people actually refer to them.
#    A list that skipped them for restaurants would answer for a Singapore
#    that only tourists visit.
#
# 2. The heartlands are in. Tiong Bahru and Katong get written about; Toa
#    Payoh, Ang Mo Kio and Jurong are where most Singaporeans live, and the
#    void deck and the neighbourhood coffeeshop belong on any honest list.
#
# 3. Malls are institutions here in a way they are not in the US corpus.
#    Not because Singapore lacks alternatives, but because air-conditioned
#    retail is genuinely civic space in the tropics — people meet, eat and
#    kill an afternoon in them.

