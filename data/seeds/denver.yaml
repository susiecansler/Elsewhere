# Denver seed corpus — named institutions locals would miss.
#
# Two judgement calls:
#
# 1. The mountains are in, but only where Denver treats them as part of
#    daily life rather than as a holiday. Red Rocks is a Denver institution;
#    Vail is not. The foothills — Mount Falcon, Lookout, Wash Park on a
#    Saturday — are how people here actually spend a weekend.
#
# 2. Green chile, brewing and the dispensary are not novelty entries. They
#    are the three things Denver genuinely does differently from every other
#    American city on this list, and a corpus that skipped them would answer
#    for Anywhere, Colorado.

