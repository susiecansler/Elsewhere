# Chicago seed corpus — the candidate pool.
#
# These are the *answers*: what an Austin query gets matched against.
# Breadth matters more here than in austin.yaml, because a role with no
# plausible Chicago candidate caps recall no matter how good the taxonomy is.
# When top-3 underperforms, widen this file before touching the taxonomy.
#
# Same conventions as austin.yaml: no pre-assigned roles, aliases are how
# people actually type it, closures get caught by verification.

