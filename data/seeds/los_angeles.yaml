# Los Angeles seed corpus — named institutions locals would miss.
#
# Curated by hand, same rules as the other cities: these are the *queries* —
# the places someone leaving LA would want an equivalent for, and the ones a
# visitor would be told to go to by a local rather than by a guidebook.
#
# Two LA-specific judgement calls:
#
# 1. The county is enormous and its institutions are neighbourhood-bound. A
#    list of only Westside or only Eastside places would answer for a city
#    nobody lives in, so this spans the basin — Santa Monica to Pasadena,
#    the Valley to South LA.
#
# 2. Chains are included where the chain *is* the institution, which is the
#    same rule that puts H-E-B in the Austin list. In-N-Out is not a burger
#    chain here in the way it is elsewhere.

