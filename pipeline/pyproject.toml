[project]
name = "elsewhere"
version = "0.1.0"
description = "Find the parallel places in an unfamiliar city"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "duckdb>=1.1.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
resolve = ["sentence-transformers>=3.3.0"]

[project.scripts]
elsewhere = "elsewhere.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elsewhere"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/Argument() in defaults is the framework's required idiom.
"elsewhere/cli.py" = ["B008"]
# Tests reach into internals deliberately.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
